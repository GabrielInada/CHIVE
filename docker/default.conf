# CHIVE static server config, baked into the Docker image at
# /etc/nginx/conf.d/default.conf. The base image's /etc/nginx/nginx.conf is left
# intact so it keeps providing events{}, http{}, "include mime.types", and gzip
# defaults. This file is included inside that http{} block.

# MIME override at http context (this file is included inside http{}). The pinned
# base image's mime.types already maps the types CHIVE serves at runtime (.js ->
# application/javascript, .wasm -> application/wasm, .json -> application/json,
# .css, fonts, .svg), all verified with `curl -I`. Only .mjs is missing from the
# base map, so map it here. The base map serves WOFF2 as font/woff2. If the base
# image is bumped, re-verify the JS/WASM/JSON/font content types before merging
# (declaring them here would only emit duplicate-extension warnings on the
# current base).
types {
    text/javascript  mjs;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    server_tokens off;
    root        /usr/share/nginx/html;
    autoindex   off;

    gzip            on;
    gzip_min_length 1024;
    # WOFF2 is already Brotli-compressed and must not be recompressed.
    gzip_types      text/css text/javascript application/javascript image/svg+xml application/json application/wasm;

    # Root document: serve index.html, always revalidate (no content hashing).
    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # HTML pages: always revalidate.
    location ~* \.html$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vendored runtime deps (libraries, wasm, fonts): change only on version bump.
    location ^~ /vendor/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # App source: no hashed filenames, so revalidate rather than long-cache.
    location ^~ /src/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else: file-only, no directory listing.
    location / {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
