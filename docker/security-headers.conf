# Shared security headers for the CHIVE static image.
#
# Included from every location block in default.conf. Nginx add_header at a
# location level replaces (does not merge with) headers from a parent level, so
# this snippet must be re-included in each location that also sets add_header
# (for example a per-location Cache-Control). Every directive uses "always" so
# the headers are also sent on 4xx/5xx responses.
#
# CSP: enforcing. The policy was validated against the browser console in
# Report-Only mode (no violations: file upload, chart render, and SVG export all
# pass) before being switched to enforcing.
#
# The policy is local-only with documented relaxations:
#   - 'unsafe-eval'      D3's CSV/DSV parser builds row objects with new Function.
#   - 'wasm-unsafe-eval' SQLite-WASM compilation.
#   - 'unsafe-inline' on style-src: D3 sets inline style attributes at runtime.
# script-src still forbids 'unsafe-inline' and external origins.
#
# To re-validate after a dependency change, swap the enforcing header below back
# to "Content-Security-Policy-Report-Only" and watch the console.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; frame-src 'none'" always;
